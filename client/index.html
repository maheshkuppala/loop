<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#10b981" />
    <meta
      name="description"
      content="LOOOP - Share. Reuse. Connect. A community unused-item sharing platform where people give away, lend, borrow, and exchange unused items."
    />
    <title>LOOOP | Share. Reuse. Connect.</title>

    <!-- Google Fonts: Outfit (Brand & Headings) & Inter (UI Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- LOOOP Brand Favicon (Triple-Ring Loop SVG - The Three O's) -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='34' cy='50' r='22' fill='none' stroke='%2310b981' stroke-width='9'/><circle cx='50' cy='50' r='22' fill='none' stroke='%23059669' stroke-width='9' stroke-opacity='0.9'/><circle cx='66' cy='50' r='22' fill='none' stroke='%23047857' stroke-width='9'/></svg>"
      type="image/svg+xml"
    />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run LOOOP.</noscript>
    <div id="root">
      <!-- Pre-React LOOOP Loading Screen (shown until React hydrates) -->
      <div id="looop-preloader" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#fafffe 0%,#f0fdf4 30%,#ffffff 70%,#f0fdf4 100%);">
        <div style="font-family:Outfit,sans-serif;font-size:clamp(3rem,8vw,5rem);font-weight:900;letter-spacing:-0.035em;color:#16A34A;text-shadow:0 1px 0 #15803D,0 2px 0 #15803D,0 3px 0 #166534,0 4px 8px rgba(22,163,74,0.15),0 0 40px rgba(22,163,74,0.08);animation:lp-entrance 1.2s ease-out both;">LOOOP</div>
        <div style="font-family:Inter,sans-serif;font-size:clamp(0.75rem,2vw,0.95rem);font-weight:600;letter-spacing:0.15em;text-transform:uppercase;color:#64748b;margin-top:0.75rem;animation:lp-entrance 1.2s ease-out 0.3s both;">Share. Reuse. Connect.</div>
        <div style="display:flex;gap:8px;margin-top:2rem;animation:lp-entrance 1.2s ease-out 0.5s both;">
          <div style="width:8px;height:8px;border-radius:50%;background:#16A34A;animation:lp-dot 1.5s ease-in-out infinite;"></div>
          <div style="width:8px;height:8px;border-radius:50%;background:#16A34A;animation:lp-dot 1.5s ease-in-out 0.2s infinite;"></div>
          <div style="width:8px;height:8px;border-radius:50%;background:#16A34A;animation:lp-dot 1.5s ease-in-out 0.4s infinite;"></div>
        </div>
        <div style="font-family:Inter,sans-serif;font-size:0.85rem;color:#94a3b8;font-weight:500;margin-top:1.5rem;animation:lp-entrance 1.2s ease-out 0.6s both;">Getting things ready...</div>
        <style>
          @keyframes lp-entrance{0%{opacity:0;transform:scale(0.92) translateZ(-30px)}50%{opacity:0.8;transform:scale(1.02) translateZ(0)}100%{opacity:1;transform:scale(1) translateZ(0)}}
          @keyframes lp-dot{0%,100%{opacity:0.3;transform:scale(0.7)}50%{opacity:1;transform:scale(1)}}
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
